server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # No trailing slash: keep the /api prefix and query string.
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
    }

    location / {
        # React Router handles routes such as /login and /reports/1.
        try_files $uri $uri/ /index.html;
    }
}
