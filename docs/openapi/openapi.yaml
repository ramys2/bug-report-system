        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
      summary: Replace a component's description
      tags:
      - Components
  /api/components/{componentId}/name:
    patch:
      description: "Access: ADMIN or DEVELOPER role."
      operationId: updateName_1
      parameters:
      - description: Id of the component.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: path
        name: componentId
        required: true
        schema:
          type: string
          format: uuid
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentNameRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateComponentResponse"
          description: Component renamed.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
      summary: Rename a component
      tags:
      - Components
  /api/components/{componentId}/responsibleUserId:
    patch:
      description: "Access: ADMIN or DEVELOPER role. Note the camelCase path segment.\
        \ A non-existing user fails with 409 from the database foreign key."
      operationId: updateResponsibleUserId
      parameters:
      - description: Id of the component.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: path
        name: componentId
        required: true
        schema:
          type: string
          format: uuid
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentResponsibleUserRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateComponentResponse"
          description: Responsible user changed.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: The request conflicts with a business rule or with existing
            data.
      summary: Change the responsible user
      tags:
      - Components
  /api/csrf:
    get:
      description: "Returns the CSRF token for the current session and sets the session\
        \ cookie. Send the token in the `X-CSRF-TOKEN` header with every POST, PATCH\
        \ and DELETE request. Access: public."
      operationId: csrf
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
          description: OK
      summary: Get a CSRF token
      tags:
      - Authentication
  /api/projects:
    get:
      description: "Access: any signed-in user."
      operationId: getAll_1
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SoftwareProjectResponse"
          description: All projects.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
      summary: List all projects
      tags:
      - Projects
    post:
      description: "Access: ADMIN role."
      operationId: create_2
      parameters:
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSoftwareProjectRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSoftwareProjectResponse"
          description: Project created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
      summary: Create a project
      tags:
      - Projects
  /api/projects/{projectId}/description:
    patch:
      description: "Access: ADMIN or DEVELOPER role."
      operationId: updateDescription_1
      parameters:
      - description: Id of the project.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: path
        name: projectId
        required: true
        schema:
          type: string
          format: uuid
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
