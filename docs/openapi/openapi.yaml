openapi: 3.1.0
info:
  description: |
    REST API of the Bug Report System, a minimalistic Jira-like bug tracker.

    **Authentication.** The API uses a session cookie and CSRF protection:
    1. Call `GET /api/csrf` to get a CSRF token (this also sets the `JSESSIONID` cookie).
    2. Sign in with `POST /api/auth/login` (form fields `username` and `password`, where `username` is the email),
       sending the token in the `X-CSRF-TOKEN` header.
    3. Send the session cookie with every request, and the `X-CSRF-TOKEN` header with every `POST`, `PATCH` and `DELETE`.
       The token changes when you sign in, so call `GET /api/csrf` again after login and use the new token.

    Only `GET /api/csrf` and `POST /api/accounts` (registration) are public. Missing sign-in answers 401,
    a missing role, ownership rule or CSRF token answers 403. Errors have the body `{"message": "..."}`.
  title: Bug Report System API
  version: 0.1.0-SNAPSHOT
servers:
- description: Generated server url
  url: http://localhost:8089
tags:
- description: "Current session, CSRF token, login and logout."
  name: Authentication
- description: "Create, read, update and resolve bug reports."
  name: Bug reports
- description: Discussion on bug reports.
  name: Comments
- description: Software projects that bug reports belong to.
  name: Projects
- description: "Parts of a project, each with a responsible developer."
  name: Components
- description: User accounts and their roles.
  name: Accounts
paths:
  /api/accounts:
    get:
      description: "Access: ADMIN role. `username` is the account's display name."
      operationId: getAll_3
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccountResponse"
          description: All accounts.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
      summary: List all accounts
      tags:
      - Accounts
    post:
      description: "Registers a new account with the REPORTER role. Access: public,\
        \ no sign-in needed. Returns 409 if the (trimmed, lower-cased) email is already\
        \ registered."
      operationId: create_4
      parameters:
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserAccountRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateUserAccountResponse"
          description: Account created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: The request conflicts with a business rule or with existing
            data.
      summary: Register an account
      tags:
      - Accounts
  /api/accounts/developers:
    get:
      description: "Lists the users with the DEVELOPER role, for example to choose\
        \ an assignee. Access: any signed-in user."
      operationId: getDevelopers
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeveloperResponse"
          description: Users with the DEVELOPER role.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
      summary: List developers
      tags:
      - Accounts
  /api/accounts/users:
    get:
      description: "Finds users whose name contains the text, ignoring case. The list\
        \ is empty if `search` is missing or blank. Access: ADMIN or DEVELOPER role."
      operationId: searchUsers
      parameters:
      - description: "Text to look for in the user's name, ignoring case."
        example: ali
        in: query
        name: search
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccountBriefResponse"
          description: Users whose name matches.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
      summary: Search users by name
      tags:
      - Accounts
  /api/accounts/{userId}/role:
    patch:
      description: "Access: ADMIN role, and not for the caller's own account. Returns\
        \ 409 if this would remove the last admin or demote a developer who still\
        \ has unclosed assigned reports."
      operationId: updateRole
      parameters:
      - description: Id of the user account.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: path
        name: userId
        required: true
        schema:
          type: string
          format: uuid
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
        required: true
      responses:
        "204":
          description: Role changed.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: The request conflicts with a business rule or with existing
            data.
      summary: Change a user's role
      tags:
      - Accounts
  /api/auth/login:
    post:
      description: "Signs in with form fields and starts a session (`JSESSIONID` cookie).\
        \ Handled by Spring Security, not by a controller. Access: public."
      operationId: login
      parameters:
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: Plain-text password.
                  example: Admin123!
                username:
                  type: string
                  description: Email address of the account.
                  example: admin@bugreport.local
              required:
              - password
              - username
        required: true
      responses:
        "200":
          description: Signed in; the session cookie is set. The body is empty.
        "401":
          description: Wrong email or password. The body is empty.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: The CSRF token is missing or invalid.
      summary: Sign in
      tags:
      - Authentication
  /api/auth/logout:
    post:
      description: "Ends the session. Handled by Spring Security, not by a controller."
      operationId: logout
      parameters:
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Signed out. The body is empty.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: The CSRF token is missing or invalid.
      summary: Sign out
      tags:
      - Authentication
  /api/auth/me:
    get:
      description: "Returns the account of the current session. Access: any signed-in\
        \ user. Login (`POST /api/auth/login`) and logout (`POST /api/auth/logout`)\
        \ are handled by Spring Security, not by this controller."
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccountResponse"
          description: The signed-in user.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
      summary: Get the signed-in user
      tags:
      - Authentication
  /api/comments:
    get:
      description: "Newest first; empty if there are none. `reportId` is required.\
        \ Access: any signed-in user."
      operationId: getComments
      parameters:
      - description: Id of the bug report.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: query
        name: reportId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommentResponse"
          description: "Comments of the report, newest first."
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
      summary: List the comments of a report
      tags:
      - Comments
    post:
      description: "Adds a comment as the signed-in user. Returns 409 if the report\
        \ is closed. Access: any signed-in user."
      operationId: create_1
      parameters:
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCommentResponse"
          description: Comment created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: The request conflicts with a business rule or with existing
            data.
      summary: Add a comment
      tags:
      - Comments
  /api/comments/{commentId}:
    delete:
      description: "Access: signed-in user; the service further requires the ADMIN\
        \ role or being the comment's author. Returns 409 if the report is closed."
      operationId: delete
      parameters:
      - description: Id of the comment.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: path
        name: commentId
        required: true
        schema:
          type: string
          format: uuid
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Comment deleted.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: The request conflicts with a business rule or with existing
            data.
      summary: Delete a comment
      tags:
      - Comments
  /api/components:
    get:
      description: "Access: any signed-in user. Without `projectId` all components\
        \ are returned; with it only the components of that project, or 404 if the\
        \ project does not exist."
      operationId: getAll_2
      parameters:
      - description: Only list components of this project.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: query
        name: projectId
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentResponse"
          description: The components.
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
      summary: List components
      tags:
      - Components
    post:
      description: "Access: ADMIN or DEVELOPER role. `projectId` must belong to an\
        \ existing project. `responsibleUserId` is optional; if given, it must belong\
        \ to an existing user. Otherwise the request fails with 404."
      operationId: create_3
      parameters:
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComponentRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateComponentResponse"
          description: Component created.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
      summary: Create a component
      tags:
      - Components
  /api/components/{componentId}/description:
    patch:
      description: "Access: ADMIN or DEVELOPER role."
      operationId: updateDescription_2
      parameters:
      - description: Id of the component.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: path
        name: componentId
        required: true
        schema:
          type: string
          format: uuid
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateComponentDescriptionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateComponentResponse"
          description: Description replaced.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
