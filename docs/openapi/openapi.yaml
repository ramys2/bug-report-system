          example: Request contains invalid values.
      required:
      - message
    BugReportBriefResponse:
      type: object
      description: "A report in the list endpoints (`GET /api/reports`, `/reported`,\
        \ `/assigned`)."
      properties:
        assignee:
          type: string
          description: Display name of the assignee. Null if unassigned.
          example: Daniel Developer
        author:
          type: string
          description: Display name of the reporter.
          example: Rachel Reporter
        createdAt:
          type: string
          description: "Creation time formatted as `dd-MM-yyyy HH:mm` (a string, unlike\
            \ other timestamps)."
          example: 14-05-2026 09:30
        reportId:
          type: string
          format: uuid
          description: Report id.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        severity:
          type: string
          description: Severity.
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          example: CRITICAL
        status:
          type: string
          description: Workflow status.
          enum:
          - OPEN
          - ASSIGNED
          - IN_PROGRESS
          - NEEDS_INFORMATION
          - REVIEWING
          - REJECTED
          - CLOSED
          example: IN_PROGRESS
        title:
          type: string
          description: Short summary.
          example: Valid users cannot sign in
      required:
      - author
      - createdAt
      - reportId
      - severity
      - status
      - title
    BugReportResponse:
      type: object
      description: "Full detail of one report, returned by `GET /api/reports/{reportId}`."
      properties:
        actualBehavior:
          type: string
          description: Actual behavior. May be null.
          example: The server returns HTTP 500 and the user remains signed out.
        assigneeName:
          type: string
          description: Display name of the assignee. Null if unassigned.
          example: Daniel Developer
        componentName:
          type: string
          description: Name of the component. Null if the report has no component.
          example: Backend API
        createdAt:
          type: string
          format: date-time
          description: Creation time (ISO-8601).
          example: 2026-05-14T09:30:00
        description:
          type: string
          description: Description. May be null.
          example: The sign-in endpoint returns HTTP 500 for valid credentials.
        expectedBehavior:
          type: string
          description: Expected behavior. May be null.
          example: The user is authenticated and redirected to the dashboard.
        id:
          type: string
          format: uuid
          description: Report id.
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        projectName:
          type: string
          description: Name of the project.
          example: Bug Report System
        reporterName:
          type: string
          description: Display name of the reporter.
          example: Rachel Reporter
        resolution:
          $ref: "#/components/schemas/Resolution"
          description: "The domain Resolution, serialized directly. Null until the\
            \ report is closed."
        severity:
          type: string
          description: Severity.
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
          example: CRITICAL
        status:
          type: string
          description: Workflow status.
          enum:
          - OPEN
          - ASSIGNED
          - IN_PROGRESS
          - NEEDS_INFORMATION
          - REVIEWING
          - REJECTED
          - CLOSED
          example: IN_PROGRESS
        stepsToReproduce:
          type: string
          description: Steps to reproduce. May be null.
          example: "Open sign in, enter valid credentials, and submit the form."
        title:
          type: string
          description: Short summary.
          example: Valid users cannot sign in
        updatedAt:
          type: string
          format: date-time
          description: Last modification time (ISO-8601).
          example: 2026-05-14T09:30:00
