      tags:
      - Bug reports
  /api/reports/{reportId}/steps-to-reproduce:
    patch:
      description: "Returns 409 if the report is closed. Access: signed-in user; the\
        \ service further requires the ADMIN role, or being the report's reporter\
        \ or assignee."
      operationId: updateStepsToReproduce
      parameters:
      - description: Id of the bug report.
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        in: path
        name: reportId
        required: true
        schema:
          type: string
          format: uuid
      - description: "CSRF token from `GET /api/csrf`. The token changes when you\
          \ sign in, so fetch a new one after login."
        in: header
        name: X-CSRF-TOKEN
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStepsToReproduceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateBugReportResponse"
          description: Steps to reproduce replaced.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "Validation failed, the JSON is malformed, or a path or query\
            \ value (for example an id) is malformed."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: Not signed in.
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: "The role or ownership check failed, or the CSRF token is missing."
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: A referenced resource does not exist.
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiErrorResponse"
          description: The request conflicts with a business rule or with existing
            data.
      summary: Replace the steps to reproduce
      tags:
      - Bug reports
components:
  schemas:
    ApiErrorResponse:
      type: object
      description: JSON body of every error response.
      properties:
        message:
          type: string
