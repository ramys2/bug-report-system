# Development environment for the bug report system.
#
# Services:
#   backend   Spring Boot API, built from ./backend (port 8080)
#   frontend  Vite dev server, built from ./frontend (port 5173); it proxies /api to http://backend:8080
#   database  MariaDB with the bug_report database
#   database-test-init
#             One-shot job that runs ./database/init to create the bug_report_test database used by
#             the backend tests; safe to run repeatedly, so it also fixes volumes created earlier
#   mailpit   Fake SMTP server that catches the notification emails; web UI on http://localhost:8025
#   artemis   ActiveMQ Artemis message broker for bug report events; console on http://localhost:8161
#
# Usage:        docker compose up --build      start everything
#               docker compose up -d database database-test-init mailpit artemis
#                                              start only the infrastructure (e.g. to run the backend yourself)
#               docker compose down            stop; add -v to also delete the stored data
# Requires:     Docker with the Compose plugin.
# Note:         The passwords below (root/root, bug_report/bug_report, artemis/artemis) are development defaults only.

services:
  # Spring Boot API. Starts once the database is healthy and the message broker has started.
  backend:
    build: ./backend
    image: bug-report-backend
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
      artemis:
        condition: service_started

  # React frontend served by the Vite dev server.
  frontend:
    build: ./frontend
    image: bug-report-frontend
    ports:
      - "5173:5173"

  # MariaDB; data is kept in the mariadb-data volume.
  database:
    image: mariadb:latest
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: bug_report
      MARIADB_USER: bug_report
      MARIADB_PASSWORD: bug_report
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job: runs the init script against the running database and exits. The database image
  # runs ./database/init only on an empty volume, so this creates bug_report_test on older volumes too.
  database-test-init:
    image: mariadb:latest
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./database/init:/init:ro
    entrypoint: ["sh", "-c", "mariadb -h database -uroot -proot < /init/01-create-test-database.sql"]
    restart: "no"

  # Catches outgoing emails; open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
        - mailpit-data:/data
    ports:
        - 8025:8025
    environment:
        MP_MAX_MESSAGES: 5000
        MP_DATABASE: /data/mailpit.db
        MP_SMTP_AUTH_ACCEPT_ANY: 1
        MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Message broker between the event publisher and the email consumer.
  artemis:
    image: apache/activemq-artemis:latest-alpine
    container_name: artemis
    restart: unless-stopped
    ports:
      - "8161:8161"
    environment:
      ARTEMIS_USER: artemis
      ARTEMIS_PASSWORD: artemis

volumes:
  mariadb-data:
  mailpit-data: