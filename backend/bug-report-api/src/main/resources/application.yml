spring:
  datasource:
    url: jdbc:mariadb://database:3306/bug_report
    username: bug_report
    password: bug_report

  artemis:
    mode: native
    broker-url: tcp://artemis:61616
    user: artemis
    password: artemis

  mail:
    host: mailpit
    port: 1025

app:
  # Filled in from the Maven project version by resource filtering.
  version: "@project.version@"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

messaging:
  destinations:
    bug-report-event: bug-report-event
