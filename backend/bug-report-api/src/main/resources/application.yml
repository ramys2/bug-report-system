spring:
  datasource:
    url: jdbc:mariadb://database:3306/bug_report
    username: bug_report
    password: bug_report

  artemis:
    mode: native
    broker-url: tcp://artemis:61616
    user: artemis
    password: artemis

  mail:
    host: mailpit
    port: 1025

app:
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      frontend-origin: http://localhost:5173
      authorization-base: /api/auth/oauth2/authorization
      callback-base: /api/auth/oauth2/code
  logging:
    # Warn when synchronous request processing takes at least five seconds.
    slow-request-ms: 5000
  # Filled in from the Maven project version by resource filtering.
  version: "@project.version@"
  cors:
    # Comma-separated list, e.g. http://localhost:5173,https://bugs.example.com
    allowed-origins: http://localhost:5173
  mail:
    from-address: no-reply@bugreport.local

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  # Sort keys alphabetically so the committed spec has stable, readable diffs.
  writer-with-order-by-keys: true

messaging:
  destinations:
    bug-report-event: bug-report-event
  publisher:
    core-pool-size: 1
    # Extra workers are created once the queue is full; must be at least core-pool-size.
    max-pool-size: 1
    # Zero disables queueing, so tasks need an available worker immediately.
    queue-capacity: 100
