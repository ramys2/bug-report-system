# Checks that the committed OpenAPI spec (docs/openapi/openapi.yaml) matches the code.
#
# It regenerates the spec with the `openapi` Maven profile (see docs/openapi/GENERATE.md) and fails if
# `git diff` shows a change, meaning someone changed the API annotations without committing the new spec.
name: OpenAPI spec

on:
  push:
    branches: [master]
  pull_request:

jobs:
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # java.version in backend/pom.xml
          cache: maven

      # The application needs MariaDB, Artemis and Mailpit to start (it is started by the Maven build).
      - name: Start infrastructure
        run: docker compose up -d --wait database mailpit artemis

      - name: Regenerate the OpenAPI spec
        working-directory: backend
        run: mvn -B verify -Popenapi -DskipTests

      - name: Fail if the committed spec is stale
        run: |
          git diff --exit-code docs/openapi/ || {
            echo "::error::docs/openapi/openapi.yaml is out of date. Run 'mvn verify -Popenapi -DskipTests' in backend/ and commit the result."
            exit 1
          }

      - name: Upload the generated spec
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: docs/openapi/openapi.yaml
